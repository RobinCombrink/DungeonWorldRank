[package]
name = "what-is-my-world-rank"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wmwr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
bytes = "1.10.1"
clap = { version = "4.5.39", features = ["derive", "string"] }
chrono = "0.4.41"
env_logger = "0.11.8"
log = "0.4.27"
reqwest = {version = "0.12.18", features = ["blocking"]}
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
